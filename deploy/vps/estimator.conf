# AI Кошторисник — SPA on / , FastAPI on /api.

upstream estimator_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /var/www/html;
    index index.html;

    # Drawing sets routinely exceed 100 MB: the client's own Skniliv package is
    # 161 MiB, which a 150M cap rejected with a 413 before the backend saw it.
    # Kept in step with MAX_UPLOAD_MB=400 in .env plus multipart overhead, so
    # the backend's own limit — which returns a readable Ukrainian message —
    # is the one that actually decides.
    client_max_body_size 450M;
    # A 150 MB upload over a slow line must not be cut off mid-body.
    client_body_timeout  600s;

    access_log /var/log/nginx/estimator.access.log main;
    error_log  /var/log/nginx/estimator.error.log;

    location /api {
        proxy_pass         http://estimator_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # POST /api/projects/{id}/analyze runs the whole AI pipeline inline and
        # only answers when it finishes, which takes minutes on a large set.
        # The 60s default would return 504 while the analysis was still running.
        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;

        # Excel exports and progress responses should reach the browser whole
        # and unbuffered rather than being held back by nginx.
        proxy_buffering off;
        # Stream the upload straight to uvicorn. Buffering a 160 MB body to
        # /var/lib/nginx/tmp first would write every drawing set to disk twice,
        # and the handler already streams it out in 1 MB chunks.
        proxy_request_buffering off;
    }

    # Hashed filenames, so the content at a given URL never changes.
    # `expires` would emit a second, weaker Cache-Control alongside this one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy keeps serving the
    # old bundle references.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
